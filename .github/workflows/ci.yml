name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cache-hit: ${{ steps.cache-deps.outputs.cache-hit }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js using mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

  lint:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js using mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Lint
        run: pnpm lint

  test:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js using mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Test with coverage
        run: pnpm test:coverage

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js using mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.next/cache
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build and export
        run: pnpm export

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-output
          path: out/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./out

      - name: Deploy to IPFS
        id: deploy
        uses: ipshipyard/ipfs-deploy-action@v1
        with:
          path-to-deploy: ./out
          kubo-api-url: /dns/ipfs.nipsys.dev/tcp/443/https
          kubo-api-auth: ${{ secrets.KUBO_API_AUTH }}
          github-token: ${{ github.token }}

      - name: Publish to IPNS
        env:
          KUBO_API_AUTH: ${{ secrets.KUBO_API_AUTH }}
        run: |
          # Publish CID to 'site' IPNS key
          PUBLISH_RESP=$(curl -X POST \
            -u "$KUBO_API_AUTH" \
            "https://ipfs.nipsys.dev/api/v0/name/publish?arg=${{ steps.deploy.outputs.cid }}&key=site")

          echo "IPNS publish response: $PUBLISH_RESP"

          IPNS_NAME=$(echo "$PUBLISH_RESP" | jq -r '.Name')
          echo "IPNS Name: $IPNS_NAME"
          echo "IPNS published successfully!"
          echo "Site available at: https://nipsys.eth.limo"

      - name: Pin to 4EVERLand
        env:
          PIN_4EVER_TOKEN: ${{ secrets.PIN_4EVER_TOKEN }}
        run: |
          # Find existing pin by name 'site'
          LIST_RESP=$(curl --request GET \
            --url https://api.4everland.dev/pins \
            --header "authorization: Bearer $PIN_4EVER_TOKEN")

          REQUESTID=$(echo "$LIST_RESP" | jq -r '.results[] | select(.pin.name == "site") | .requestid')

          if [ -z "$REQUESTID" ]; then
            echo "No existing pin found, creating new pin..."

            PIN_RESP=$(curl --request POST \
              --url https://api.4everland.dev/pins \
              --header "authorization: Bearer $PIN_4EVER_TOKEN" \
              --header "content-type: application/json" \
              --data "{
                \"cid\": \"${{ steps.deploy.outputs.cid }}\",
                \"name\": \"site\"
              }")

            REQUESTID=$(echo "$PIN_RESP" | jq -r '.requestid')
            STATUS=$(echo "$PIN_RESP" | jq -r '.status')
            echo "Created pin: REQUESTID=$REQUESTID, STATUS=$STATUS"
          else
            echo "Found existing pin, updating CID..."

            PIN_RESP=$(curl --request POST \
              --url https://api.4everland.dev/pins/$REQUESTID \
              --header "authorization: Bearer $PIN_4EVER_TOKEN" \
              --header "content-type: application/json" \
              --data "{
                \"cid\": \"${{ steps.deploy.outputs.cid }}\",
                \"name\": \"site\"
              }")

            REQUESTID=$(echo "$PIN_RESP" | jq -r '.requestid')
            STATUS=$(echo "$PIN_RESP" | jq -r '.status')
            echo "Updated pin: REQUESTID=$REQUESTID, STATUS=$STATUS"
          fi

          # Poll for pinned status (max 60 seconds)
          echo "Waiting for pin to finalize..."
          for i in {1..12}; do
            STATUS_RESP=$(curl --request GET \
              --url https://api.4everland.dev/pins/$REQUESTID \
              --header "authorization: Bearer $PIN_4EVER_TOKEN")

            PIN_STATUS=$(echo "$STATUS_RESP" | jq -r '.status')
            echo "Poll $i: STATUS=$PIN_STATUS"

            if [ "$PIN_STATUS" = "pinned" ]; then
              echo "✅ Pin successful!"
              exit 0
            elif [ "$PIN_STATUS" = "failed" ]; then
              echo "❌ Pin failed!"
              echo "$STATUS_RESP" | jq -r '.info'
              exit 1
            fi

            sleep 5
          done

          echo "⚠️ TIMEOUT: Pin did not reach 'pinned' status within 60 seconds"
          exit 1