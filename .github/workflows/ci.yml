name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cache-hit: ${{ steps.cache-deps.outputs.cache-hit }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js using mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

  lint:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js using mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Lint
        run: pnpm lint

  test:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js using mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Test with coverage
        run: pnpm test:coverage

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js using mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.next/cache
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build and export
        run: pnpm export

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-output
          path: out/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./out

      - name: Deploy to IPFS
        id: deploy
        uses: ipshipyard/ipfs-deploy-action@v3
        with:
          path-to-deploy: ./out
          kubo-version: v0.43.1
          # Keep the CID semantics @v1 applied by default (CIDv1, 1 MiB chunks,
          # no raw leaves) so identical content still maps to the same CID.
          cid-profile: ''
          ipfs-add-options: '--cid-version 1 --chunker size-1048576'
          kubo-api-url: ${{ secrets.KUBO_API_URL }}
          kubo-api-auth: ${{ secrets.KUBO_API_AUTH }}
          github-token: ${{ github.token }}

      - name: Publish to IPNS
        env:
          KUBO_API_URL: ${{ secrets.KUBO_API_URL }}
          KUBO_API_AUTH: ${{ secrets.KUBO_API_AUTH }}
        run: |
          # Publish CID to 'site' IPNS key
          PUBLISH_RESP=$(ipfs --api "${KUBO_API_URL}" --api-auth "${KUBO_API_AUTH}" name publish --key=site "${{ steps.deploy.outputs.cid }}")

          echo "IPNS publish response: $PUBLISH_RESP"

          IPNS_NAME=$(echo "$PUBLISH_RESP" | grep -oE 'Published to [a-zA-Z0-9]+' | awk '{print $3}')
          echo "IPNS Name: $IPNS_NAME"
          echo "IPNS published successfully!"
          echo "Site available at: https://xav.gwei.site"

      - name: Pin to 4EVERLand
        id: pin-4everland
        continue-on-error: true
        env:
          PIN_4EVER_TOKEN: ${{ secrets.PIN_4EVER_TOKEN }}
        run: |
          # Find existing pin by name 'site'
          LIST_RESP=$(curl --request GET \
            --url https://api.4everland.dev/pins \
            --header "authorization: Bearer $PIN_4EVER_TOKEN")

          REQUESTID=$(echo "$LIST_RESP" | jq -r '.results[] | select(.pin.name == "site") | .requestid')

          if [ -z "$REQUESTID" ]; then
            echo "No existing pin found, creating new pin..."

            PIN_RESP=$(curl --request POST \
              --url https://api.4everland.dev/pins \
              --header "authorization: Bearer $PIN_4EVER_TOKEN" \
              --header "content-type: application/json" \
              --data "{
                \"cid\": \"${{ steps.deploy.outputs.cid }}\",
                \"name\": \"site\"
              }")

            REQUESTID=$(echo "$PIN_RESP" | jq -r '.requestid')
            STATUS=$(echo "$PIN_RESP" | jq -r '.status')
            echo "Created pin: REQUESTID=$REQUESTID, STATUS=$STATUS"
          else
            echo "Found existing pin, updating CID..."

            PIN_RESP=$(curl --request POST \
              --url https://api.4everland.dev/pins/$REQUESTID \
              --header "authorization: Bearer $PIN_4EVER_TOKEN" \
              --header "content-type: application/json" \
              --data "{
                \"cid\": \"${{ steps.deploy.outputs.cid }}\",
                \"name\": \"site\"
              }")

            REQUESTID=$(echo "$PIN_RESP" | jq -r '.requestid')
            STATUS=$(echo "$PIN_RESP" | jq -r '.status')
            echo "Updated pin: REQUESTID=$REQUESTID, STATUS=$STATUS"
          fi

          # Poll for pinned status (max 60 seconds)
          echo "Waiting for pin to finalize..."
          for i in {1..12}; do
            STATUS_RESP=$(curl --request GET \
              --url https://api.4everland.dev/pins/$REQUESTID \
              --header "authorization: Bearer $PIN_4EVER_TOKEN")

            PIN_STATUS=$(echo "$STATUS_RESP" | jq -r '.status')
            echo "Poll $i: STATUS=$PIN_STATUS"

            if [ "$PIN_STATUS" = "pinned" ]; then
              echo "✅ Pin successful!"
              exit 0
            elif [ "$PIN_STATUS" = "failed" ]; then
              echo "❌ Pin failed!"
              echo "$STATUS_RESP" | jq -r '.info'
              exit 1
            fi

            sleep 5
          done

          echo "⚠️ TIMEOUT: Pin did not reach 'pinned' status within 60 seconds"
          exit 1

      - name: Pin to Filebase
        id: pin-filebase
        continue-on-error: true
        env:
          # Filebase IPFS Pinning Service API auth: a per-bucket Secret Access
          # Token (Bearer).
          FILEBASE_TOKEN: ${{ secrets.FILEBASE_TOKEN }}
          FILEBASE_CID: ${{ steps.deploy.outputs.cid }}
        run: |
          # Find the existing 'site' pin (PSA replace avoids duplicate pins on redeploy)
          LIST_RESP=$(curl --silent --show-error --write-out '\n%{http_code}' \
            --url "https://api.filebase.io/v1/ipfs/pins?name=site&match=exact&limit=1" \
            --header "authorization: Bearer ${FILEBASE_TOKEN}")

          HTTP_CODE=$(echo "$LIST_RESP" | tail -n1)
          LIST_BODY=$(echo "$LIST_RESP" | sed '$d')

          echo "Filebase pin list response (HTTP $HTTP_CODE):"
          echo "$LIST_BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Filebase pin list failed with HTTP $HTTP_CODE"
            exit 1
          fi

          REQUESTID=$(echo "$LIST_BODY" | jq -r '.results[0].requestid // empty')

          if [ -z "$REQUESTID" ]; then
            echo "No existing pin found, creating new pin..."

            PIN_RESP=$(curl --silent --show-error --write-out '\n%{http_code}' \
              --request POST \
              --url https://api.filebase.io/v1/ipfs/pins \
              --header "authorization: Bearer ${FILEBASE_TOKEN}" \
              --header "content-type: application/json" \
              --data "{\"cid\": \"${FILEBASE_CID}\", \"name\": \"site\"}")
          else
            echo "Found existing pin, replacing CID (requestid: ${REQUESTID})..."

            PIN_RESP=$(curl --silent --show-error --write-out '\n%{http_code}' \
              --request POST \
              --url "https://api.filebase.io/v1/ipfs/pins/${REQUESTID}" \
              --header "authorization: Bearer ${FILEBASE_TOKEN}" \
              --header "content-type: application/json" \
              --data "{\"cid\": \"${FILEBASE_CID}\", \"name\": \"site\"}")
          fi

          HTTP_CODE=$(echo "$PIN_RESP" | tail -n1)
          PIN_BODY=$(echo "$PIN_RESP" | sed '$d')

          echo "Filebase pin response (HTTP $HTTP_CODE):"
          echo "$PIN_BODY"

          if [ "$HTTP_CODE" != "202" ]; then
            echo "❌ Filebase pin failed with HTTP $HTTP_CODE"
            exit 1
          fi

          REQUESTID=$(echo "$PIN_BODY" | jq -r '.requestid')
          STATUS=$(echo "$PIN_BODY" | jq -r '.status')
          echo "Pin accepted: REQUESTID=$REQUESTID, STATUS=$STATUS"

          # Poll for pinned status (max 60 seconds)
          echo "Waiting for pin to finalize..."
          for i in {1..12}; do
            STATUS_RESP=$(curl --silent --show-error \
              --url "https://api.filebase.io/v1/ipfs/pins/${REQUESTID}" \
              --header "authorization: Bearer ${FILEBASE_TOKEN}")

            PIN_STATUS=$(echo "$STATUS_RESP" | jq -r '.status')
            echo "Poll $i: STATUS=$PIN_STATUS"

            if [ "$PIN_STATUS" = "pinned" ]; then
              echo "✅ Pin successful! (CID: ${FILEBASE_CID})"
              exit 0
            elif [ "$PIN_STATUS" = "failed" ]; then
              echo "❌ Pin failed!"
              echo "$STATUS_RESP" | jq -r '.info'
              exit 1
            fi

            sleep 5
          done

          echo "⚠️ TIMEOUT: Pin did not reach 'pinned' status within 60 seconds"
          exit 1

      - name: Check pin results
        if: always()
        env:
          EVERLAND_OUTCOME: ${{ steps.pin-4everland.outcome }}
          FILEBASE_OUTCOME: ${{ steps.pin-filebase.outcome }}
        run: |
          echo "4EVERLAND: ${EVERLAND_OUTCOME} / Filebase: ${FILEBASE_OUTCOME}"

          if [ "${EVERLAND_OUTCOME}" != "success" ] || [ "${FILEBASE_OUTCOME}" != "success" ]; then
            echo "❌ One or more pin steps failed"
            exit 1
          fi

          echo "✅ All pins succeeded"
